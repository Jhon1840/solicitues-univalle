services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_ENV: local
      APP_KEY: base64:VPOyeDwhFBVAixFL5h6T5P5JnRM+BNUScROjZ3YlgcM=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: campus_connect
      DB_USERNAME: campus
      DB_PASSWORD: secret
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus_connect
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_connect"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
